<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Atlas Bug Reporter social preview</title>
  <desc id="desc">A polished preview image for the Atlas Bug Reporter beta feedback site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#f6f1ff"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4f8fdf"/>
      <stop offset="1" stop-color="#6f78e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 508 C160 456 303 470 429 525 C561 582 686 592 846 536 C984 488 1077 472 1200 509 L1200 630 L0 630 Z" fill="#dceaf8" opacity="0.62"/>
  <path d="M918 0 L1200 0 L1200 230 C1111 201 1035 151 982 80 C958 49 937 24 918 0 Z" fill="#fff7df" opacity="0.78"/>
  <path d="M0 0 L347 0 C286 43 221 86 152 128 C92 165 42 207 0 255 Z" fill="#eaf7f1" opacity="0.82"/>

  <g transform="translate(84 84)">
    <rect x="0" y="0" width="242" height="38" rx="19" fill="#ffffff" opacity="0.84"/>
    <text x="22" y="25" fill="#566377" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">ATLAS BUG REPORTER</text>

    <text x="0" y="116" fill="#101828" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="78" font-weight="800">Clear beta</text>
    <text x="0" y="196" fill="#101828" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="78" font-weight="800">feedback,</text>
    <text x="0" y="276" fill="#101828" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="78" font-weight="800">ready to fix.</text>

    <text x="2" y="334" fill="#566377" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="28" font-weight="500">Private bug reporting for testers, product</text>
    <text x="2" y="371" fill="#566377" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="28" font-weight="500">teams, and fast-moving releases.</text>

    <g transform="translate(0 425)">
      <rect x="0" y="0" width="148" height="48" rx="24" fill="url(#button)"/>
      <text x="30" y="31" fill="#ffffff" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Sign in</text>
      <rect x="166" y="0" width="198" height="48" rx="24" fill="#ffffff" stroke="#d6e3f3"/>
      <text x="196" y="31" fill="#101828" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Report issues</text>
    </g>
  </g>

  <g transform="translate(676 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="486" rx="32" fill="#ffffff" opacity="0.94"/>
    <rect x="28" y="28" width="384" height="76" rx="22" fill="#f5f9ff" stroke="#dbe8f6"/>
    <circle cx="65" cy="66" r="16" fill="#4f8fdf"/>
    <circle cx="103" cy="66" r="16" fill="#f5c96b"/>
    <circle cx="141" cy="66" r="16" fill="#51b98e"/>
    <rect x="190" y="52" width="174" height="14" rx="7" fill="#c9d7ea"/>
    <rect x="190" y="76" width="122" height="10" rx="5" fill="#dde7f4"/>

    <text x="32" y="154" fill="#101828" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="30" font-weight="800">Bug report dashboard</text>
    <text x="32" y="188" fill="#566377" font-family="Avenir Next, Inter, Segoe UI, sans-serif" font-size="17" font-weight="500">Structured intake for every tester note.</text>

    <g transform="translate(32 222)">
      <rect x="0" y="0" width="376" height="72" rx="18" fill="#fff8e9" stroke="#f1ddb1"/>
      <rect x="20" y="20" width="84" height="22" rx="11" fill="#f5c96b"/>
      <text x="34" y="36" fill="#7b5313" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">MEDIUM</text>
      <rect x="122" y="19" width="200" height="14" rx="7" fill="#c79f44" opacity="0.48"/>
      <rect x="122" y="43" width="128" height="10" rx="5" fill="#d6bb70" opacity="0.48"/>
    </g>

    <g transform="translate(32 314)">
      <rect x="0" y="0" width="376" height="72" rx="18" fill="#eff7ff" stroke="#d5e8ff"/>
      <rect x="20" y="20" width="70" height="22" rx="11" fill="#7fb8ff"/>
      <text x="34" y="36" fill="#215d9d" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">OPEN</text>
      <rect x="122" y="19" width="218" height="14" rx="7" fill="#4f8fdf" opacity="0.42"/>
      <rect x="122" y="43" width="150" height="10" rx="5" fill="#8ebcec" opacity="0.58"/>
    </g>

    <g transform="translate(32 406)">
      <rect x="0" y="0" width="376" height="52" rx="18" fill="#ecf8f2" stroke="#cceada"/>
      <rect x="20" y="18" width="92" height="18" rx="9" fill="#51b98e"/>
      <text x="36" y="31" fill="#15523e" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">RESOLVED</text>
      <rect x="132" y="19" width="184" height="12" rx="6" fill="#55a987" opacity="0.38"/>
    </g>
  </g>
</svg>
