<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Password Reset</title>
    <meta
      name="description"
      content="Reset your Atlas password."
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/reset-password.js" defer></script>
  </head>
  <body>
    <main class="site-shell site-shell--centered">
      <section class="auth-card auth-card--compact">
        <p class="eyebrow">Atlas bug reporter</p>
        <h1 class="reset-title">Choose a new password</h1>
        <p class="panel-copy">
          This reset link is single-use. Save a new password and we’ll sign you in
          automatically.
        </p>

        <form id="reset-form" novalidate>
          <label class="field">
            <span>New password</span>
            <input
              name="password"
              type="password"
              autocomplete="new-password"
            />
            <small>Use at least 10 characters.</small>
            <p class="field-error" data-error-for="password"></p>
          </label>

          <button id="reset-button" class="button-primary" type="submit">
            Update password
          </button>
        </form>

        <section id="reset-status" class="status" aria-live="polite"></section>
        <a class="text-link" href="/">Back to login</a>
      </section>
    </main>
  </body>
</html>
